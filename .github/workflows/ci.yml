name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install with CPU-only torch
        run: |
          uv sync --extra codecs --extra fast
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install safetensors optuna
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Rebuild the Essen sample and check it against the record
        run: uv run --no-sync geoneural reproduce

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Parity and property tests
        working-directory: native
        run: cargo test --release
      - name: WebAssembly build
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          RUSTFLAGS="--remap-path-prefix=$HOME=~" wasm-pack build native/landscape-wasm --target web --release

  web:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the kernel
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          RUSTFLAGS="--remap-path-prefix=$HOME=~" wasm-pack build native/landscape-wasm --target web --release
      - name: Typecheck, test, build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
