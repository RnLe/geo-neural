[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoneural"
version = "0.1.0"
description = "Terrain compression, drainage diagnostics and learned conservative closures on real NRW elevation data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rene-Marcel Lehner" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "rasterio>=1.3.10,<2",
    "pyproj>=3.6,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# Codec competitors: zstd, zfp, wavelets, and SZ3 through hdf5plugin.
codecs = ["zstandard>=0.23,<1", "zfpy>=1.0,<2", "PyWavelets>=1.6,<2", "h5py>=3.12,<4", "hdf5plugin>=5,<8"]
# Neural models and architecture search.
ml = ["torch>=2.5,<3", "safetensors>=0.4,<1", "optuna>=4,<6"]
# JIT drainage routing; optional and guarded at import.
fast = ["numba>=0.60,<1"]
# GK100 vector preparation.
vector = ["fiona>=1.10,<2"]
all = ["geoneural[codecs,ml,fast,vector]"]

[project.scripts]
geoneural = "geoneural.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/geoneural"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
