[workspace]
members = ["landscape-core", "landscape-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rene-Marcel Lehner"]

# Parity tests run convolution stacks; unoptimised builds make them slow.
[profile.test]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
