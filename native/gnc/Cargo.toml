[package]
name = "gnc"
description = "Exact decoder of GeoNeural .gnc terrain products, natively and in WebAssembly"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rene-Marcel Lehner"]
publish = false

# Standalone: not a member of the landscape workspace next door.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.4"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# Parity tests decode whole fields; unoptimised builds make them slow.
[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
